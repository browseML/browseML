# SPDX-License-Identifier: MIT OR Apache-2.0
# The C ABI of overlord-dsp: liboverlord_dsp_c.so, for python/overlord_dsp_rs.py (ctypes). Standalone; not wired.
[package]
name = "overlord-dsp-capi"
version = "0.0.2"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "overlord_dsp_c"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
overlord-dsp = { path = ".." }
