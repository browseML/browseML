# SPDX-License-Identifier: MIT OR Apache-2.0
# PROOF OF CONCEPT, iteration 2 (2026-10-12); not wired into browseML or mindX: see ../docs/RENDER_RUST.md §4 (the gate).
[package]
name = "overlord-dsp"
version = "0.0.2"
edition = "2021"
publish = false
description = "The OVERLORD v4 sentence DSP in zero-dependency Rust, bit-exact against overlord_dsp.py (numpy + numba) on x86-64 and wasm32"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "overlord-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "gen-tables"
path = "src/bin/gen_tables.rs"

# No crates, as bankML / voaice.rs / streamair: the FFT is in-crate.
[dependencies]

# Its own workspace root, so browseML's Cargo.toml (which excludes bankml) is not touched. capi/ is the C ABI
# (liboverlord_dsp_c.so) as its own package: a cdylib beside the rlib in one package collides with the test build.
[workspace]
members = ["capi"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
