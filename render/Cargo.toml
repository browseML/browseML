# SPDX-License-Identifier: MIT OR Apache-2.0
# SCRATCH PROOF OF CONCEPT (2026-10-12), not wired into browseML: see ../docs/RENDER_RUST.md.
[package]
name = "overlord-dsp"
version = "0.0.1"
edition = "2021"
publish = false
description = "OVERLORD v4 DSP layers in zero-dependency Rust, held against overlord_dsp.py (numpy + numba) by golden outputs"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "overlord-bench"
path = "src/bin/bench.rs"

# No crates, as bankML / voaice.rs / streamair: the FFT is in-crate.
[dependencies]

# Its own workspace root, so browseML's Cargo.toml (which excludes bankml) is not touched.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
